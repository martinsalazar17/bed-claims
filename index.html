<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f2a1e">
<title>SGPA Hospital Bills — USC</title>

<!-- Tab / bookmark / home-screen icons (files sit next to this index.html).
     Bump the ?v= number when you change an icon, so browsers fetch the new one. -->
<link rel="icon" href="/favicon.ico?v=2" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=2">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=1">

<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background: #0f2a1e;
    font-family: Arial, sans-serif;
  }

  /* Entry animation: loading.mp4 on white, then fades into the app */
  #loader {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #ffffff;
    z-index: 2;
    transition: opacity 0.45s ease;
  }
  #loader video {
    max-width: min(70vw, 360px);
    max-height: 50vh;
    display: block;
  }
  #loader .spinner {
    display: none;                       /* shown only if the video cannot play */
    width: 36px;
    height: 36px;
    border: 3px solid rgba(15, 42, 30, 0.18);
    border-top-color: #00a651;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  #loader.no-video video { display: none; }
  #loader.no-video .spinner { display: block; }
  @keyframes spin { to { transform: rotate(360deg); } }

  #app-frame {
    position: fixed;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    border: none;
    z-index: 1;
  }

  @media (prefers-reduced-motion: reduce) {
    #loader { transition: none; }
    #loader .spinner { animation-duration: 2s; }
  }
</style>
</head>
<body>

  <div id="loader" role="status" aria-label="Loading SGPA Hospital Bills">
    <video id="intro" src="/loading.mp4" autoplay muted playsinline preload="auto"></video>
    <div class="spinner"></div>
  </div>

  <iframe
    id="app-frame"
    src="https://script.google.com/macros/s/AKfycbzq_PYMsB9AYlOvKAJuLYQYA1qZA3CTnQzOSLhyAPpIjoq6Zs6WUZs6KM-6aIvOHrkS/exec"
    title="SGPA Hospital Bills"
    allow="clipboard-write">
  </iframe>

<script>
(function () {
  var loader = document.getElementById('loader');
  var frame  = document.getElementById('app-frame');
  var intro  = document.getElementById('intro');
  var appReady = false, introDone = false, revealed = false;

  // Reveal only when BOTH the intro has finished and the app has loaded.
  function reveal() {
    if (revealed || !appReady || !introDone) return;
    revealed = true;
    loader.style.opacity = '0';
    setTimeout(function () { loader.style.display = 'none'; }, 480);
  }
  function endIntro() { introDone = true; reveal(); }

  frame.addEventListener('load', function () { appReady = true; reveal(); });

  // The intro never blocks the app: no video, a blocked video or a slow one all fall through.
  intro.addEventListener('ended', endIntro);
  intro.addEventListener('error', function () { loader.classList.add('no-video'); introDone = true; reveal(); });
  var p = intro.play && intro.play();
  if (p && p.catch) p.catch(function () { loader.classList.add('no-video'); introDone = true; reveal(); });

  // Safety nets
  setTimeout(endIntro, 6000);                                       // intro never longer than 6 s
  setTimeout(function () { appReady = true; reveal(); }, 20000);    // never stay stuck on the loader
})();
</script>

</body>
</html>
